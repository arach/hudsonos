name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install docs dependencies
        working-directory: hudson-docs
        run: bun install --frozen-lockfile

      - name: Build site (Next.js + docs merge)
        run: bun run build:site

      # wrangler refuses to bind a Worker custom_domain when the hostname has
      # externally managed DNS records. Worker bindings appear in DNS as a
      # placeholder AAAA (100::) or A (192.0.2.0/24) record — we keep those
      # and only clear "real" external records. Once the Worker is fully bound,
      # only the placeholders remain and this step becomes a no-op.
      - name: Clear stale DNS records on hudsonos.com / www.hudsonos.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          api() { curl -fsSL -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$@"; }
          ZONE=$(api "https://api.cloudflare.com/client/v4/zones?name=hudsonos.com" | jq -r '.result[0].id // empty')
          if [ -z "$ZONE" ]; then
            echo "::error::Could not look up Cloudflare zone for hudsonos.com — token likely lacks Zone:Read"
            exit 1
          fi
          echo "Zone $ZONE"
          for HOST in hudsonos.com www.hudsonos.com; do
            BODY=$(api "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?name=$HOST")
            ALL=$(echo "$BODY" | jq -r '.result[] | "\(.type)|\(.content)|\(.id)"')
            if [ -z "$ALL" ]; then
              echo "$HOST: no records at all"
              continue
            fi
            echo "$HOST: full record list:"
            echo "$ALL" | sed 's/^/  /'
            # Skip Worker-owned placeholders (100:: AAAA, 192.0.2.x A) — those
            # ARE the Worker binding and deleting them returns 400. Skip TXT/MX/SOA.
            IDS=$(echo "$ALL" | awk -F'|' '
              ($1=="A" && $2 !~ /^192\.0\.2\./) ||
              ($1=="AAAA" && $2 != "100::") ||
              ($1=="CNAME") { printf "%s %s %s\n", $3, $1, $2 }
            ')
            if [ -z "$IDS" ]; then
              echo "$HOST: nothing to delete (Worker already bound or only TXT/MX/etc)"
              continue
            fi
            while IFS= read -r LINE; do
              ID=$(echo "$LINE" | awk '{print $1}')
              REST=$(echo "$LINE" | cut -d' ' -f2-)
              echo "Deleting $REST on $HOST (id=$ID)"
              if ! api -X DELETE "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records/$ID" > /dev/null; then
                echo "  warning: delete failed (record may be Worker-managed); continuing"
              fi
            done <<< "$IDS"
          done

      - name: Deploy to Cloudflare Workers
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
