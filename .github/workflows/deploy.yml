name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install docs dependencies
        working-directory: hudson-docs
        run: bun install --frozen-lockfile

      - name: Build site (Next.js + docs merge)
        run: bun run build:site

      # wrangler refuses to bind a Worker custom_domain when the hostname has
      # externally managed DNS records. Worker custom_domain bindings don't use
      # traditional DNS records (they live in a separate routing layer), so on
      # the two hostnames we control here, any A/AAAA/CNAME is by definition
      # stale and safe to delete. Once the Worker is bound, this step is a no-op.
      - name: Clear stale DNS records on hudsonos.com / www.hudsonos.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api() { curl -fsSL -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$@"; }
          ZONE=$(api "https://api.cloudflare.com/client/v4/zones?name=hudsonos.com" | jq -r '.result[0].id // empty')
          if [ -z "$ZONE" ]; then
            echo "::error::Could not look up Cloudflare zone for hudsonos.com — token likely lacks Zone:Read"
            exit 1
          fi
          echo "Zone $ZONE"
          for HOST in hudsonos.com www.hudsonos.com; do
            ALL=$(api "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?name=$HOST" \
              | jq -r '.result[] | "\(.type) \(.content) \(.id)"')
            if [ -z "$ALL" ]; then
              echo "$HOST: no records at all"
              continue
            fi
            echo "$HOST: full record list:"
            echo "$ALL" | sed 's/^/  /'
            # Only A, AAAA, CNAME conflict with Worker custom_domain routing
            IDS=$(echo "$ALL" | awk '$1=="A" || $1=="AAAA" || $1=="CNAME" {print $3, $1, $2}')
            if [ -z "$IDS" ]; then
              echo "$HOST: nothing to delete (only TXT/MX/etc present)"
              continue
            fi
            while IFS= read -r LINE; do
              ID=$(echo "$LINE" | awk '{print $1}')
              REST=$(echo "$LINE" | cut -d' ' -f2-)
              echo "Deleting $REST on $HOST (id=$ID)"
              api -X DELETE "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records/$ID" > /dev/null
            done <<< "$IDS"
          done

      - name: Deploy to Cloudflare Workers
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
