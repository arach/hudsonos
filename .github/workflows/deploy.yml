name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install docs dependencies
        working-directory: hudson-docs
        run: bun install --frozen-lockfile

      - name: Build site (Next.js + docs merge)
        run: bun run build:site

      # wrangler refuses to bind a Worker custom_domain when the hostname has
      # externally managed DNS records (leftover GH Pages A records on the apex,
      # CNAMEs to github.io on www). Wrangler's auto-override path doesn't fire
      # for this conflict class, so we clear known GH Pages-shaped records first.
      # Idempotent — once the cutover lands and the Worker owns the routing,
      # no matching records exist and this step is a no-op.
      - name: Clear stale GH Pages DNS records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api() { curl -fsSL -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$@"; }
          ZONE=$(api "https://api.cloudflare.com/client/v4/zones?name=hudsonos.com" | jq -r '.result[0].id // empty')
          if [ -z "$ZONE" ]; then
            echo "::error::Could not look up Cloudflare zone for hudsonos.com — token likely lacks Zone:Read"
            exit 1
          fi
          echo "Zone $ZONE"
          # GH Pages A IPs (apex) + any CNAME pointing at *.github.io (www)
          IP_RX='^185\.199\.10[89]\.153$|^185\.199\.11[01]\.153$'
          CNAME_RX='\\.github\\.io$|^arach\\.github\\.io$'
          for HOST in hudsonos.com www.hudsonos.com; do
            IDS=$(api "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?name=$HOST" \
              | jq -r --arg ip "$IP_RX" --arg cn "$CNAME_RX" '
                  .result[]
                  | select(
                      (.type == "A" and (.content | test($ip))) or
                      (.type == "CNAME" and (.content | test($cn)))
                    )
                  | "\(.id) \(.type) \(.content)"
                ')
            if [ -z "$IDS" ]; then
              echo "$HOST: no stale records to delete"
              continue
            fi
            while IFS= read -r LINE; do
              ID=$(echo "$LINE" | awk '{print $1}')
              REST=$(echo "$LINE" | cut -d' ' -f2-)
              echo "Deleting $REST on $HOST (id=$ID)"
              api -X DELETE "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records/$ID" > /dev/null
            done <<< "$IDS"
          done

      - name: Deploy to Cloudflare Workers
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
